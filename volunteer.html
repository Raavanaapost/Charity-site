<body data-page="volunteer">
<header class="bar">
  <div class="wrap">
    <a class="logo" href="/" aria-label="Raavanaa Beyond the Lanes, home">
      <picture><source srcset="/img/logo.webp?v=3" type="image/webp"><img src="/img/logo.jpg?v=3" alt="Raavanaa · Beyond the Lanes · Creating Smiles" width="900" height="298"></picture>
    </a>
    <button class="menu-btn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="site-nav"><span></span><span></span><span></span></button>
    <nav class="nav" id="site-nav"><a href="/">Home</a><a href="/initiated">Projects</a><a href="/about">About us</a><a href="/contact">Contact</a></nav>
  </div>
</header>
<main id="app" class="wrap">
  <div class="contact-layout">
    <section class="slide-box" id="vol-slides" aria-label="Volunteer with us">
      <h1 class="follow-title">Volunteer with us</h1>
      <p>Give an hour, share a skill, or bring a friend. Tell us how you'd like to help and one of our team will reply.</p>
    </section>
    <form class="panel form" name="volunteer" method="POST" action="/volunteer?sent=1" data-netlify="true" netlify-honeypot="bot-field" data-ajax data-done="Thank you for stepping up! One of our team will be in touch soon.">
      <input type="hidden" name="form-name" value="volunteer">
      <p hidden><label>Leave empty <input name="bot-field"></label></p>
      <label for="v-name">Your name<input id="v-name" name="name" required autocomplete="name"></label>
      <label for="v-email">Email<input id="v-email" name="email" type="email" required autocomplete="email"></label>
      <label for="v-phone">Phone <span class="opt">(optional)</span><input id="v-phone" name="phone" type="tel" autocomplete="tel"></label>
      <fieldset class="checks">
        <legend>How would you like to help?</legend>
        <label><input type="checkbox" id="v-h1" name="help[]" value="Help at events"> Help at events</label>
        <label><input type="checkbox" id="v-h2" name="help[]" value="Share a skill"> Share a skill</label>
        <label><input type="checkbox" id="v-h3" name="help[]" value="Lead an activity"> Lead an activity</label>
        <label><input type="checkbox" id="v-h4" name="help[]" value="Drive or carry things"> Drive or carry things</label>
        <label><input type="checkbox" id="v-h5" name="help[]" value="Wherever needed"> Wherever I'm needed</label>
      </fieldset>
      <label for="v-when">When are you usually free?
        <select id="v-when" name="availability">
          <option>Weekends</option>
          <option>Weekday evenings</option>
          <option>Weekdays</option>
          <option>It varies</option>
        </select>
      </label>
      <label for="v-message">Anything you'd like us to know <span class="opt">(optional)</span><textarea id="v-message" name="message"></textarea></label>
      <button class="btn" type="submit">I want to volunteer</button>
      <p class="note" data-msg hidden></p>
    </form>
  </div>
</main>
<footer><div class="wrap"><span>© <span data-year></span> <span data-site-name></span></span><span data-site-footer></span></div></footer>
<script src="/site.js"></script>
</body>
</html>
