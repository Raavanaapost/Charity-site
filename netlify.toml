# RaavanaaPost (raavanaapost.raavanaa.org): a ready-made static site.
# Nothing to build; Netlify publishes the "site" folder as it is.
[build]
  publish = "site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/wp-content/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
