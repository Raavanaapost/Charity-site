  <path d="M160 40v120" stroke="#8a5c12" stroke-width="3"/>
  <path d="M160 160l-80 70M160 160l80 70" stroke="#8a5c12" stroke-width="3"/>
  <g class="bob" style="animation-duration:5s">
    <path d="M70 230h180c0 60-40 92-90 92s-90-32-90-92z" fill="#f7efe1" stroke="#c9a24a" stroke-width="3"/>
    <path d="M70 230h180" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <path d="M90 262q70 30 140 0" stroke="#a9c8f0" stroke-width="5" fill="none"/>
    <path d="M100 286q60 26 120 0" stroke="#f2b8c6" stroke-width="5" fill="none"/>
  </g>
  <g><g fill="#f29a1f"><circle cx="100" cy="362" r="15"/><circle cx="220" cy="362" r="15"/><circle cx="160" cy="372" r="17"/></g><g fill="#e4761b"><circle cx="100" cy="362" r="9"/><circle cx="220" cy="362" r="9"/><circle cx="160" cy="372" r="10"/></g><g fill="#ffc94a"><circle cx="128" cy="374" r="11"/><circle cx="192" cy="374" r="11"/></g><ellipse cx="66" cy="356" rx="16" ry="7" fill="#4f8f45" transform="rotate(-25 66 356)"/><ellipse cx="254" cy="356" rx="16" ry="7" fill="#4f8f45" transform="rotate(25 254 356)"/></g>
</svg>
