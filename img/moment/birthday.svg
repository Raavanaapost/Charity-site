  <g class="flick"><path d="M126 161.2c4.8999999999999995 7.699999999999999 7.699999999999999 12.6 7.699999999999999 17.5a7.699999999999999 7.699999999999999 0 0 1-15.399999999999999 0c0-4.8999999999999995 2.8-9.799999999999999 7.699999999999999-17.5z" fill="url(#flame)"/><path d="M126 172.4c2.0999999999999996 3.5 3.15 5.6 3.15 7.699999999999999a3.15 3.15 0 0 1-6.3 0c0-2.0999999999999996 1.0499999999999998-4.199999999999999 3.15-7.699999999999999z" fill="#fff7d6"/></g><g class="flick"><path d="M160 161.2c4.8999999999999995 7.699999999999999 7.699999999999999 12.6 7.699999999999999 17.5a7.699999999999999 7.699999999999999 0 0 1-15.399999999999999 0c0-4.8999999999999995 2.8-9.799999999999999 7.699999999999999-17.5z" fill="url(#flame)"/><path d="M160 172.4c2.0999999999999996 3.5 3.15 5.6 3.15 7.699999999999999a3.15 3.15 0 0 1-6.3 0c0-2.0999999999999996 1.0499999999999998-4.199999999999999 3.15-7.699999999999999z" fill="#fff7d6"/></g><g class="flick"><path d="M194 161.2c4.8999999999999995 7.699999999999999 7.699999999999999 12.6 7.699999999999999 17.5a7.699999999999999 7.699999999999999 0 0 1-15.399999999999999 0c0-4.8999999999999995 2.8-9.799999999999999 7.699999999999999-17.5z" fill="url(#flame)"/><path d="M194 172.4c2.0999999999999996 3.5 3.15 5.6 3.15 7.699999999999999a3.15 3.15 0 0 1-6.3 0c0-2.0999999999999996 1.0499999999999998-4.199999999999999 3.15-7.699999999999999z" fill="#fff7d6"/></g>
