<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-label="A lit brass oil lamp with marigolds">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#ffb347" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" x2="1">
      <stop offset="0" stop-color="#9a6a17"/>
      <stop offset=".35" stop-color="#e6b94f"/>
      <stop offset=".55" stop-color="#f6d98a"/>
      <stop offset=".8" stop-color="#c8922c"/>
      <stop offset="1" stop-color="#8a5c12"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d9480f"/>
      <stop offset=".45" stop-color="#ff9d2e"/>
      <stop offset="1" stop-color="#fff2b8"/>
    </linearGradient>
  </defs>
  <style>
    .lamp-flame{transform-origin:160px 112px;animation:flick 2.6s ease-in-out infinite}
    .lamp-glow{transform-origin:160px 92px;animation:breathe 3.2s ease-in-out infinite}
    @keyframes flick{0%,100%{transform:scale(1,1) rotate(0)}30%{transform:scale(.96,1.05) rotate(-2deg)}60%{transform:scale(1.03,.97) rotate(1.5deg)}}
    @keyframes breathe{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
    @media (prefers-reduced-motion:reduce){.lamp-flame,.lamp-glow{animation:none}}
  </style>
  <circle class="lamp-glow" cx="160" cy="92" r="92" fill="url(#glow)"/>
  <g class="lamp-flame">
    <path d="M160 40c14 22 22 36 22 52a22 22 0 0 1-44 0c0-16 8-30 22-52z" fill="url(#flame)"/>
    <path d="M160 70c6 10 9 16 9 23a9 9 0 0 1-18 0c0-7 3-13 9-23z" fill="#fff7d6"/>
  </g>
  <!-- the lamp: bowl, stem, base -->
  <path d="M96 128h128c-4 26-30 42-64 42s-60-16-64-42z" fill="url(#brass)"/>
  <ellipse cx="160" cy="128" rx="64" ry="9" fill="#f8e2a4"/>
  <ellipse cx="160" cy="128" rx="52" ry="5.5" fill="#7a4f0e" opacity=".55"/>
  <path d="M150 170h20l-3 22h-14z" fill="url(#brass)"/>
  <ellipse cx="160" cy="196" rx="20" ry="7" fill="url(#brass)"/>
  <path d="M152 200h16l-2 70h-12z" fill="url(#brass)"/>
  <ellipse cx="160" cy="232" rx="13" ry="5" fill="url(#brass)"/>
  <ellipse cx="160" cy="274" rx="26" ry="8" fill="url(#brass)"/>
  <path d="M138 278h44c10 22 32 34 56 40H82c24-6 46-18 56-40z" fill="url(#brass)"/>
  <ellipse cx="160" cy="320" rx="80" ry="12" fill="url(#brass)"/>
  <ellipse cx="160" cy="318" rx="70" ry="6" fill="#f8e2a4" opacity=".7"/>
  <!-- marigolds and leaves at the foot -->
  <g>
    <path d="M40 360c30-14 60-12 86-2" stroke="#3f7a3a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M280 360c-30-14-60-12-86-2" stroke="#3f7a3a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="66" cy="346" rx="16" ry="7" fill="#4f8f45" transform="rotate(-25 66 346)"/>
    <ellipse cx="254" cy="346" rx="16" ry="7" fill="#4f8f45" transform="rotate(25 254 346)"/>
    <g fill="#f29a1f"><circle cx="100" cy="352" r="15"/><circle cx="220" cy="352" r="15"/><circle cx="160" cy="362" r="17"/></g>
    <g fill="#e4761b"><circle cx="100" cy="352" r="9"/><circle cx="220" cy="352" r="9"/><circle cx="160" cy="362" r="10"/></g>
    <g fill="#ffc94a"><circle cx="128" cy="364" r="11"/><circle cx="192" cy="364" r="11"/></g>
    <g fill="#f3a92a"><circle cx="128" cy="364" r="6"/><circle cx="192" cy="364" r="6"/></g>
    <circle cx="74" cy="368" r="9" fill="#c8381e"/><circle cx="246" cy="368" r="9" fill="#c8381e"/>
  </g>
</svg>
