  <path d="M100 212h120v14H100z" fill="#8a3c1c"/>
  <path d="M104 214c4-22 20-30 30-22 6-16 28-18 34-4 10-12 30-8 32 8 12-6 22 2 18 18z" fill="#fff8e8"/>
  <path d="M112 262h96M108 290h104" stroke="#f2b33d" stroke-width="6"/><path d="M100 248q60 22 120 0" stroke="#4f8f45" stroke-width="5" fill="none"/>
  <g fill="none" stroke="#e4761b" stroke-width="3"><path d="M160 352c18 0 18 24 36 24-18 0-18 24-36 24-18 0-18-24-36-24 18 0 18-24 36-24z"/></g>
  <g fill="#c8381e"><circle cx="130" cy="376" r="3"/><circle cx="160" cy="376" r="3"/><circle cx="190" cy="376" r="3"/></g>
</svg>
