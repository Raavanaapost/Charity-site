  <path d="M280 220c-20 0-42 18-60 40l-40 44c-8 10-6 24 6 28 26 8 62-4 86-32 12-14 20-36 20-54 0-14-4-26-12-26z" fill="#b97a4c"/>
  <path d="M60 300c18 20 42 30 66 32M260 300c-18 20-42 30-66 32" stroke="#8e5a33" stroke-width="2" fill="none"/>
  <path class="twinkle" d="M70 82l2.24 5.76 5.76 2.24-5.76 2.24-2.24 5.76-2.24-5.76-5.76-2.24 5.76-2.24z" fill="#f2b33d"/><path class="twinkle" d="M250 70l2.8000000000000003 7.199999999999999 7.199999999999999 2.8000000000000003-7.199999999999999 2.8000000000000003-2.8000000000000003 7.199999999999999-2.8000000000000003-7.199999999999999-7.199999999999999-2.8000000000000003 7.199999999999999-2.8000000000000003z" fill="#f2b33d"/><path class="twinkle" d="M280 154l1.6800000000000002 4.32 4.32 1.6800000000000002-4.32 1.6800000000000002-1.6800000000000002 4.32-1.6800000000000002-4.32-4.32-1.6800000000000002 4.32-1.6800000000000002z" fill="#f2b33d"/>
  <g><g fill="#f29a1f"><circle cx="100" cy="370" r="15"/><circle cx="220" cy="370" r="15"/><circle cx="160" cy="380" r="17"/></g><g fill="#e4761b"><circle cx="100" cy="370" r="9"/><circle cx="220" cy="370" r="9"/><circle cx="160" cy="380" r="10"/></g><g fill="#ffc94a"><circle cx="128" cy="382" r="11"/><circle cx="192" cy="382" r="11"/></g><ellipse cx="66" cy="364" rx="16" ry="7" fill="#4f8f45" transform="rotate(-25 66 364)"/><ellipse cx="254" cy="364" rx="16" ry="7" fill="#4f8f45" transform="rotate(25 254 364)"/></g>
</svg>
