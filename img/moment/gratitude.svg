<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-label="Two hands holding a glowing heart">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe1dc" stop-opacity=".9"/><stop offset=".5" stop-color="#f5a39a" stop-opacity=".3"/><stop offset="1" stop-color="#f5a39a" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#9a6a17"/><stop offset=".4" stop-color="#e6b94f"/><stop offset=".6" stop-color="#f6d98a"/><stop offset="1" stop-color="#a8761a"/></linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#d9480f"/><stop offset=".45" stop-color="#ff9d2e"/><stop offset="1" stop-color="#fff2b8"/></linearGradient>
  </defs>
  <style>
    .flick{transform-box:fill-box;transform-origin:50% 100%;animation:flick 2.4s ease-in-out infinite}
    .bob{transform-box:fill-box;transform-origin:50% 100%;animation:bob 4s ease-in-out infinite}
    .twinkle{animation:tw 2.8s ease-in-out infinite}
    .glow{transform-box:fill-box;transform-origin:center;animation:br 3.4s ease-in-out infinite}
    @keyframes flick{0%,100%{transform:scale(1,1)}35%{transform:scale(.94,1.06) rotate(-2deg)}65%{transform:scale(1.04,.96) rotate(2deg)}}
    @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(2deg)}}
    @keyframes tw{0%,100%{opacity:1}50%{opacity:.35}}
    @keyframes br{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
    @media (prefers-reduced-motion:reduce){.flick,.bob,.twinkle,.glow{animation:none}}
  </style>
  <circle class="glow" cx="160" cy="170" r="150" fill="url(#glow)"/>

  <path class="glow" d="M160 210s-58-36-58-78a32 32 0 0 1 58-18 32 32 0 0 1 58 18c0 42-58 78-58 78z" fill="#e2493a"/>
  <path d="M146 140a16 16 0 0 1 12-8" stroke="#ffb3a6" stroke-width="5" stroke-linecap="round" fill="none"/>
