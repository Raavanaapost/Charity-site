<use href="#tea" x="40" y="280"/><use href="#tea" x="100" y="270"/><use href="#tea" x="160" y="268"/><use href="#tea" x="220" y="276"/><use href="#tea" x="280" y="290"/>
<use href="#tea" x="20" y="320"/><use href="#tea" x="80" y="312"/><use href="#tea" x="140" y="308"/><use href="#tea" x="200" y="314"/><use href="#tea" x="260" y="326"/><use href="#tea" x="320" y="340"/><use href="#tea" x="380" y="358"/>
<use href="#tea" x="40" y="360"/><use href="#tea" x="100" y="352"/><use href="#tea" x="160" y="350"/><use href="#tea" x="220" y="356"/><use href="#tea" x="280" y="368"/><use href="#tea" x="340" y="384"/><use href="#tea" x="400" y="402"/><use href="#tea" x="450" y="420"/>
