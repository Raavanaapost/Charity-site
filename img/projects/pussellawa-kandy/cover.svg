<g transform="translate(470 470) rotate(8)">
<rect x="0" y="0" width="250" height="96" rx="18" fill="#e5851a"/>
<rect x="0" y="62" width="250" height="10" fill="#b8440a"/>
<g fill="#fff6e3"><rect x="16" y="14" width="40" height="34" rx="5"/><rect x="66" y="14" width="40" height="34" rx="5"/><rect x="116" y="14" width="40" height="34" rx="5"/><rect x="166" y="14" width="40" height="34" rx="5"/><rect x="214" y="14" width="26" height="48" rx="5"/></g>
<use href="#kid" x="36" y="36"/><use href="#kid" x="86" y="36"/><use href="#kid" x="136" y="36"/><use href="#kid" x="186" y="36"/>
<circle cx="56" cy="98" r="19" fill="#3a2a1e"/><circle cx="56" cy="98" r="7" fill="#c9c2b6"/><circle cx="196" cy="98" r="19" fill="#3a2a1e"/><circle cx="196" cy="98" r="7" fill="#c9c2b6"/>
<circle cx="246" cy="76" r="6" fill="#ffd85a"/>
</g>
<!-- a little trail of hearts behind the bus -->
<g fill="#c0392b" opacity=".8"><path d="M420 470 c-6 -8 -18 -2 -12 8 l12 12 12 -12 c6 -10 -6 -16 -12 -8z"/><path d="M372 432 c-4 -6 -13 -2 -9 6 l9 9 9 -9 c4 -8 -5 -12 -9 -6z"/><path d="M336 400 c-3 -4 -9 -1 -6 4 l6 6 6 -6 c3 -5 -3 -8 -6 -4z"/></g>
