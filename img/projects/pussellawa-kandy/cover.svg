<path d="M0 -40 V-58" stroke="#e5851a" stroke-width="5" stroke-linecap="round"/><circle cx="0" cy="-62" r="7" fill="#f7c63a"/>
<g fill="#e9d6b4"><rect x="-52" y="58" width="12" height="60" rx="6"/><rect x="-28" y="58" width="12" height="60" rx="6"/><rect x="-6" y="58" width="12" height="60" rx="6"/><rect x="16" y="58" width="12" height="60" rx="6"/><rect x="40" y="58" width="12" height="60" rx="6"/></g>
