<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="A school bus full of waving children winds down from the tea hills of Pussellawa towards the Temple of the Tooth by Kandy Lake and the royal palms of Peradeniya">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6e3"/><stop offset=".7" stop-color="#fde3b0"/><stop offset="1" stop-color="#f9d58e"/></linearGradient>
<radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd85a"/><stop offset="1" stop-color="#ef9a22"/></radialGradient>
<linearGradient id="lake" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd0c9"/><stop offset="1" stop-color="#5a9f98"/></linearGradient>
<linearGradient id="road" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c79a63"/><stop offset="1" stop-color="#d9b07a"/></linearGradient>
<g id="palm"><path d="M0 0 C-4 -60 4 -120 0 -170" stroke="#8b6a45" stroke-width="9" fill="none" stroke-linecap="round"/><g stroke="#2f7a45" stroke-width="8" fill="none" stroke-linecap="round"><path d="M0 -170 q-36 -16 -68 6"/><path d="M0 -170 q-38 -2 -66 30"/><path d="M0 -170 q-30 14 -50 50"/><path d="M0 -170 q36 -16 68 6"/><path d="M0 -170 q38 -2 66 30"/><path d="M0 -170 q30 14 50 50"/><path d="M0 -170 q-6 -26 -2 -46"/></g></g>
<g id="tea"><ellipse cx="0" cy="0" rx="26" ry="11" fill="#3f8a50"/><ellipse cx="-6" cy="-4" rx="12" ry="5" fill="#5aa866"/></g>
<g id="kid"><circle cx="0" cy="0" r="7" fill="#7a4b2a"/><path d="M-6 6 L-14 -10 M6 6 L14 -10" stroke="#7a4b2a" stroke-width="4" stroke-linecap="round"/></g>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="1010" cy="120" r="64" fill="url(#sun)"/>
<g stroke="#ef9a22" stroke-width="6" stroke-linecap="round" opacity=".7"><path d="M1010 30v-18M1090 60l14-12M1110 120h18M930 60l-14-12M910 120h-18"/></g>
<g fill="#fff" opacity=".85"><path d="M150 110 q20 -30 50 -10 q25 -22 50 4 q30 -2 26 22 h-136 q-12 -12 10 -16z"/><path d="M640 70 q16 -22 40 -8 q22 -16 40 4 q24 0 20 18 h-110 q-8 -10 10 -14z"/></g>
