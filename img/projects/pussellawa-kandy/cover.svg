<!-- Peradeniya palms on the right -->
<use href="#palm" x="1080" y="420"/><use href="#palm" x="1140" y="430" transform="scale(1)"/><g transform="translate(1180 432) scale(.85)"><use href="#palm"/></g><g transform="translate(1040 414) scale(.75)"><use href="#palm"/></g>
<!-- the winding road from the hills to Kandy -->
<path d="M210 272 C300 300 180 360 300 400 C420 440 380 520 560 560 C700 590 900 580 1200 600" fill="none" stroke="url(#road)" stroke-width="46" stroke-linecap="round"/>
<path d="M210 272 C300 300 180 360 300 400 C420 440 380 520 560 560 C700 590 900 580 1200 600" fill="none" stroke="#fff6e3" stroke-width="4" stroke-dasharray="18 16" stroke-linecap="round"/>
<path d="M0 600 Q300 570 560 610 T1200 640 V675 H0Z" fill="#3f8a50"/>
<!-- flowers -->
<g><circle cx="80" cy="630" r="8" fill="#e5851a"/><circle cx="130" cy="644" r="8" fill="#c0392b"/><circle cx="190" cy="628" r="8" fill="#f7c63a"/><circle cx="700" cy="646" r="8" fill="#e5851a"/><circle cx="760" cy="636" r="8" fill="#c0392b"/><circle cx="1120" cy="652" r="8" fill="#f7c63a"/></g>
