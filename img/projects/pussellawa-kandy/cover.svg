<path d="M-14 42 L20 10 H150 L184 42Z" fill="#b8440a"/>
<g fill="#e9d6b4"><rect x="16" y="66" width="14" height="50" rx="7"/><rect x="50" y="66" width="14" height="50" rx="7"/><rect x="106" y="66" width="14" height="50" rx="7"/><rect x="140" y="66" width="14" height="50" rx="7"/></g>
<path d="M78 130 V82 q7 -14 14 0 V130Z" fill="#c0392b"/>
</g>
