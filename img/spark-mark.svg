<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Spark a Smile">
  <!-- The mark of "Spark a Smile" (16 Nov 2026): the same heart as Gift a Moment, with a green rim (the Initiated
       colour, where every project starts) and a spark inside. -->
  <defs>
    <linearGradient id="sp-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7c63a"/><stop offset=".5" stop-color="#3f9a5f"/><stop offset="1" stop-color="#1f7a47"/>
    </linearGradient>
    <radialGradient id="sp-glow" cx=".5" cy=".46" r=".6">
      <stop offset="0" stop-color="#fffdf2"/><stop offset=".55" stop-color="#f3f6dc"/><stop offset="1" stop-color="#d8ebb8"/>
    </radialGradient>
    <linearGradient id="sp-star" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e5851a"/><stop offset=".6" stop-color="#f29a1f"/><stop offset="1" stop-color="#f7c63a"/>
    </linearGradient>
  </defs>
  <path d="M48 86C22 67 7 49 7 31 7 17 17.5 7 30 7c7.6 0 14 3.6 18 9.8C52 10.6 58.4 7 66 7c12.5 0 23 10 23 24 0 18-15 36-41 55z" fill="url(#sp-glow)" stroke="url(#sp-rim)" stroke-width="6" stroke-linejoin="round"/>
  <path d="M48 19l4.6 14.2L67 38l-14.4 4.8L48 57l-4.6-14.2L29 38l14.4-4.8z" fill="url(#sp-star)"/>
  <path d="M48 30l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="#fff6c8"/>
  <path d="M66 17v7M62.5 20.5h7M28 50v6M25 53h6" stroke="#1f7a47" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M38 63c3 3 6.4 4.4 10 4.4s7-1.4 10-4.4" fill="none" stroke="#1f7a47" stroke-width="3.4" stroke-linecap="round"/>
</svg>
