<g id="ykidb"><circle cx="0" cy="-22" r="7" fill="#7a4b2a"/><path d="M-8 -14 h16 l4 20 h-24z" fill="#f7c63a"/><path d="M-4 6 v10 M4 6 v10" stroke="#7a4b2a" stroke-width="4" stroke-linecap="round"/></g>
