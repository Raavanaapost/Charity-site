<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 -40 1100 825" width="800" height="600" role="img" aria-label="Pre-school children cross the black iron bridge over the Pali Aru on their way to a riverside picnic with ice cream, with palmyra palms and a temple tower beyond">
