<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Initiate an Opportunity · Raavanaa · Beyond the Lanes</title>
<meta name="description" content="Raavanaa gives children a day of joy they will remember: a game, a trip, a good meal. Every penny goes to the day, and every smile is shared.">
<meta name="theme-color" content="#0f5132">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192.png?v=3">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=3">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Raavanaa · Beyond the Lanes">
<meta property="og:title" content="Raavanaa · Beyond the Lanes">
<meta property="og:description" content="Giving children a day of joy they will remember. Every penny goes to the day, and every smile is shared.">
<meta property="og:image" content="https://raavanaa.org/img/og-image.jpg?v=3">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Inter:wght@900&family=Playfair+Display:ital,wght@0,800;0,900;1,900&family=Merriweather:wght@900&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="initiate">
<header class="bar">
  <div class="wrap">
    <a class="logo" href="/" aria-label="Raavanaa Beyond the Lanes, home">
      <picture><source srcset="/img/logo.webp?v=3" type="image/webp"><img src="/img/logo.jpg?v=3" alt="Raavanaa · Beyond the Lanes · Creating Smiles" width="900" height="298"></picture>
    </a>
    <button class="menu-btn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="site-nav"><span></span><span></span><span></span></button>
    <nav class="nav" id="site-nav"><a href="/">Home</a><a href="/initiated">Projects</a><a href="/about">About us</a><a href="/contact">Contact</a></nav>
  </div>
</header>
<main id="app" class="wrap">
  <div class="initiate">
    <h1 class="sr">Initiate an Opportunity</h1>
    <picture class="initiate-hero">
      <source srcset="/img/initiate-hero.webp" type="image/webp">
      <img src="/img/initiate-hero.jpg" width="1024" height="546" alt="Initiate an Opportunity. Know of an opportunity where we could help create a smile or meaningful experience for children? Five children run through a sunny field.">
    </picture>
    <form class="initiate-card" name="opportunity" method="POST" action="/initiate?sent=1" data-netlify="true" netlify-honeypot="bot-field" data-ajax data-done="Thank you! Your opportunity has been sent. Our team will review how we can help.">
      <input type="hidden" name="form-name" value="opportunity">
      <p hidden><label>Leave empty <input name="bot-field"></label></p>
      <div class="initiate-head">
        <svg viewBox="0 0 48 44" width="46" height="42" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" aria-hidden="true"><path d="M30 5l8 13"></path><path d="M5 28l22 8"></path><path d="M14 10l14 14"></path></svg>
        <div>
          <h2>Tell us about the opportunity</h2>
          <p>Share the details below and our team will review how we can help.</p>
        </div>
      </div>

      <label class="i-field" for="o-title"><span>Project Title <b class="req" aria-hidden="true">*</b></span>
        <input id="o-title" name="title" required maxlength="120" placeholder="e.g. Jaffna Children's Recreation Day"></label>

      <div class="i-row">
        <label class="i-field" for="o-category"><span>Primary Project Category <b class="req" aria-hidden="true">*</b></span>
          <select id="o-category" name="category" required>
            <option value="" selected disabled>Select a category</option>
            <option>Trips &amp; Events</option>
            <option>Education</option>
            <option>Other</option>
          </select></label>
        <div class="i-field">
          <span id="o-focus-label">Project Focus <u class="opt">(optional)</u></span>
          <details class="multi" id="o-focus">
            <summary aria-labelledby="o-focus-label o-focus-value"><span id="o-focus-value" data-empty="Select one or more">Select one or more</span></summary>
            <div class="multi-list" role="group" aria-labelledby="o-focus-label">
              <label><input type="checkbox" name="focus[]" value="A game or activity"> A game or activity</label>
              <label><input type="checkbox" name="focus[]" value="A trip or outing"> A trip or outing</label>
              <label><input type="checkbox" name="focus[]" value="A good meal"> A good meal</label>
              <label><input type="checkbox" name="focus[]" value="Learning support"> Learning support</label>
              <label><input type="checkbox" name="focus[]" value="Children with special needs"> Children with special needs</label>
              <label><input type="checkbox" name="focus[]" value="Children's home"> Children's home</label>
            </div>
          </details>
        </div>
      </div>

      <label class="i-field" for="o-description"><span>Brief Description <b class="req" aria-hidden="true">*</b></span>
        <span class="i-area">
          <textarea id="o-description" name="description" required maxlength="1000" rows="4" placeholder="Please tell us about the opportunity, what you have in mind, and how it could create a positive experience for children."></textarea>
          <span class="i-count" aria-hidden="true"><span id="o-count">0</span>/1000</span>
        </span></label>

      <div class="i-row">
        <label class="i-field" for="o-location"><span>Location <b class="req" aria-hidden="true">*</b></span>
          <input id="o-location" name="location" required placeholder="City, Province/State, Country"></label>
        <label class="i-field" for="o-children"><span>Approximate Number of Children <b class="req" aria-hidden="true">*</b></span>
          <input id="o-children" name="children" required inputmode="numeric" placeholder="e.g. 20"></label>
      </div>

      <div class="i-row">
        <label class="i-field" for="o-contact"><span>Organisation / Contact Person</span>
          <input id="o-contact" name="contact" autocomplete="name" placeholder="Name and organization (if any)"></label>
        <label class="i-field" for="o-reach"><span>Email or Phone <b class="req" aria-hidden="true">*</b></span>
          <input id="o-reach" name="reach" required autocomplete="email" placeholder="So we can reply to you"></label>
      </div>

      <label class="i-field" for="o-more"><span>Additional Information <u class="opt">(optional)</u></span>
        <textarea id="o-more" name="additional" rows="2" placeholder="Any other details, timing, support needed, etc."></textarea></label>

      <button class="i-submit" type="submit">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor" aria-hidden="true"><path d="M21.5 2.5 2.5 10.2l6.3 2.4 1.9 6.9 3.3-4.3 4.6 3.3z"></path></svg>
        Submit Opportunity</button>
      <p class="note" data-msg hidden></p>
    </form>
  </div>
</main>
<footer><div class="wrap"><span>© <span data-year></span> <span data-site-name></span></span><span data-site-footer></span></div></footer>
<script src="/site.js"></script>
</body>
</html>
