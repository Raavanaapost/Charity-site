<style>
  /* Raavanaa Community "Coming soon" front page: one picture, the wide one on computers and the tall one on phones. */
  html, body { margin: 0; height: 100%; }
  body { background: #FDF5E5; }
  main { display: grid; place-items: center; min-height: 100vh; min-height: 100svh; }
  picture, img { display: block; }
  img { width: 100vw; height: 100vh; height: 100svh; object-fit: contain; }
  /* Tall phones: the picture fills the width, centred; the space above it stays cream
     and the space below it continues the green grass at the bottom of the picture. */
  @media (orientation: portrait) and (max-aspect-ratio: 941/1672) {
    main { display: flex; flex-direction: column; place-items: stretch; }
    img { height: auto; }
    main::before { content: ""; flex: 1; }
    main::after { content: ""; flex: 1; background: linear-gradient(#7C9B3E, #5E8434); }
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<main>
  <h1 class="sr">Raavanaa Community: coming soon</h1>
  <picture>
    <source media="(orientation: portrait)" srcset="/img/coming-soon-tall.webp" type="image/webp">
    <source media="(orientation: portrait)" srcset="/img/coming-soon-tall.jpg">
    <source srcset="/img/coming-soon-wide.webp" type="image/webp">
    <img src="/img/coming-soon-wide.jpg" width="1672" height="941" alt="Raavanaa Community. Bridging hearts, building hope. Coming soon (விரைவில்). A bridge between people who need a hand and people ready to give one. How it works: share a need, local review, open support, shared results. raavanaa.org">
  </picture>
</main>
</body>
