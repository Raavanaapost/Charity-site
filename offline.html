<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No connection · Raavanaa</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f5132">
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Tamil",sans-serif;background:#fbf6ea;color:#1d2622;display:grid;place-items:center;
    padding:max(28px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom));text-align:center;line-height:1.5}
  main{max-width:440px;width:100%}
  .mark{width:112px;height:112px;border-radius:26px;display:block;margin:0 auto 18px;box-shadow:0 10px 26px -14px rgba(15,81,50,.55)}
  h1{font-size:26px;line-height:1.2;margin:0 0 6px;color:#0f5132}
  p{margin:0 0 6px;font-size:16.5px;color:#3d4a44}
  .ta{font-size:15.5px}
  h1.ta{font-size:21px;margin-top:14px}
  button{appearance:none;border:0;border-radius:999px;background:#0f5132;color:#fff;font:inherit;font-weight:700;font-size:17px;padding:13px 30px;margin:20px 0 4px;cursor:pointer;box-shadow:0 10px 20px -12px rgba(15,81,50,.8)}
  button:focus-visible,a:focus-visible{outline:3px solid #e5851a;outline-offset:3px}
  .saved{margin:26px 0 0;padding:16px 16px 8px;border:1.5px solid #e6dcc3;border-radius:16px;background:#fffdf7;text-align:left}
  .saved h2{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:#8a6a1c;margin:0 0 6px}
  .saved ul{list-style:none;margin:0;padding:0}
  .saved li{border-top:1px solid #efe7d2}
  .saved li:first-child{border-top:0}
  .saved a{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;color:#0f5132;font-weight:600;text-decoration:none}
  .saved a::after{content:"›";color:#b97a06;font-size:20px;line-height:1}
  .line{height:4px;width:84px;margin:16px auto;border-radius:4px;background:linear-gradient(90deg,#e5851a,#c8381e 50%,#f2b21c)}
</style>
</head>
<body>
<main>
  <img class="mark" src="/img/app/icon-192.png" alt="Raavanaa" width="112" height="112">
  <h1>No connection right now</h1>
  <p>This page has not been saved on your phone yet. It will open as soon as you are back online.</p>
  <div class="line" aria-hidden="true"></div>
  <h1 class="ta" lang="ta">இப்போது இணைப்பு இல்லை</h1>
  <p class="ta" lang="ta">இந்தப் பக்கம் இன்னும் உங்கள் தொலைபேசியில் சேமிக்கப்படவில்லை. இணைப்பு திரும்பியதும் திறக்கும்.</p>
  <button type="button" id="again">Try again · மீண்டும் முயலுங்கள்</button>
  <section class="saved" id="saved" hidden>
    <h2>Pages you can open now · இப்போது திறக்கக்கூடியவை</h2>
    <ul id="saved-list"></ul>
  </section>
</main>
<script>
(function () {
  var again = function () { location.reload(); };
  document.getElementById("again").addEventListener("click", again);
  window.addEventListener("online", again);
  // The pages already saved on this phone, so there is still somewhere to go.
  var NAMES = { "/overview": "Home", "/initiated": "Projects: Initiated", "/activated": "Projects: Activated", "/impact": "Projects: Impact",
    "/moment": "Gift a Moment", "/fund": "Raavanaa Fund", "/give": "Sponsor a Smile", "/smile-map": "Smile Map", "/about": "About us",
    "/how-it-works": "How it works", "/post": "Raavanaa Post", "/contact": "Contact", "/volunteer": "Volunteer", "/initiate": "Start a project", "/home": "Find a project" };
  var nice = function (path) {
    var ta = /^\/ta\//.test(path), p = ta ? path.slice(3) : path, name = NAMES[p];
    if (!name) { var m = p.match(/^\/projects\/([^/]+)$/); if (m) name = decodeURIComponent(m[1]).replace(/-/g, " ").replace(/^./, function (c) { return c.toUpperCase(); }); }
    return name ? name + (ta ? " (தமிழ்)" : "") : "";
  };
  if (!("caches" in window)) return;
  caches.keys().then(function (names) {
    return Promise.all(names.filter(function (n) { return /^raav-app-/.test(n); }).map(function (n) { return caches.open(n).then(function (c) { return c.keys(); }); }));
  }).then(function (lists) {
    var seen = {}, rows = [];
    lists.forEach(function (keys) { keys.forEach(function (req) {
      var path = new URL(req.url).pathname, name = nice(path);
      if (name && !seen[path] && path !== location.pathname) { seen[path] = 1; rows.push([path, name]); }
    }); });
    if (!rows.length) return;
    rows.sort(function (a, b) { return a[1] < b[1] ? -1 : 1; });
    var list = document.getElementById("saved-list");
    rows.slice(0, 12).forEach(function (r) { var li = document.createElement("li"), a = document.createElement("a"); a.href = r[0]; a.textContent = r[1]; li.appendChild(a); list.appendChild(li); });
    document.getElementById("saved").hidden = false;
  }).catch(function () {});
})();
</script>
</body>
</html>
