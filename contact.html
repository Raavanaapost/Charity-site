<body data-page="contact">
<header class="bar">
  <div class="wrap">
    <a class="logo" href="/home" aria-label="Raavanaa Beyond the Lanes, home">
      <picture><source srcset="/img/logo.webp?v=3" type="image/webp"><img src="/img/logo.jpg?v=3" alt="Raavanaa · Beyond the Lanes · Creating Smiles" width="900" height="298"></picture>
    </a>
    <button class="menu-btn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="site-nav"><span></span><span></span><span></span></button>
    <nav class="nav" id="site-nav"><a href="/home">Home</a><a href="/initiated">Projects</a><a href="/about">About us</a><a href="/contact">Contact</a></nav>
  </div>
</header>
<main id="app" class="wrap">
  <div class="contact-layout">
    <section class="slide-box" id="contact-slides" aria-label="Get involved">
      <h1 class="follow-title">Get involved</h1>
      <p>Want to volunteer, suggest a project, partner with us, or just ask a question? Send us a message and one of our team will reply.</p>
    </section>
    <form class="panel form" name="contact" method="POST" action="/contact?sent=1" data-netlify="true" netlify-honeypot="bot-field" data-ajax data-done="Thank you! Your message has been sent. We'll get back to you soon.">
      <input type="hidden" name="form-name" value="contact">
      <p hidden><label>Leave empty <input name="bot-field"></label></p>
      <label for="c-name">Your name<input id="c-name" name="name" required autocomplete="name"></label>
      <label for="c-email">Email<input id="c-email" name="email" type="email" required autocomplete="email"></label>
      <label for="c-phone">Phone <span class="opt">(optional)</span><input id="c-phone" name="phone" type="tel" autocomplete="tel"></label>
      <label for="c-reason">I'd like to
        <select id="c-reason" name="reason">
          <option>Volunteer</option>
          <option>Ask a question</option>
          <option>Partner with you</option>
          <option>Suggest a project</option>
          <option>Something else</option>
        </select>
      </label>
      <label for="c-message">Message<textarea id="c-message" name="message" required></textarea></label>
      <button class="btn" type="submit">Send message</button>
      <p class="note fine">We only use your details to reply to you. <a href="/privacy">Privacy &amp; child safety</a></p>
      <p class="note" data-msg hidden></p>
    </form>
  </div>
</main>
<footer><div class="wrap"><span>© <span data-year></span> <span data-site-name></span></span><span data-site-footer></span></div></footer>
<script src="/site.js"></script>
</body>
</html>
